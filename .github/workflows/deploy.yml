name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送不打断正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # notes.json 是 gitignore 的派生产物，由 package.json 的 prebuild 钩子
      # 自动生成（`npm run build` 会先跑 `npm run notes`）。
      # 这步失败会让整个构建挂掉 —— 这是有意的：宁可部署不出来，
      # 也不要发一个「笔记数据是上一次的」的站点出去。
      - name: 构建
        run: npm run build

      # 分享卡片标签的构建期核对（2026-10-14 补）。
      #
      # 必须在**构建之后**跑：og:image 里的域名 / 子路径与 vite.config.js 的
      # REPO_NAME 是**两处独立的地方**，换仓库名时只改一处，站点照样跑，
      # 只有分享卡片静默指向一张 404 的图。脚本从产物反推实际 base 再要求
      # og 自洽，所以换名字时不用改它。
      - name: 核对分享卡片标签（og / twitter）
        run: npm run check:meta

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
